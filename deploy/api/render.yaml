services:
  - type: web
    name: mirae-ai-api
    runtime: python
    rootDir: deploy/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MODEL_API_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        value: Mirae-Qwen2.5-1.5B-Instruct
