<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirae AI · API 키</title>
<style>
:root{--bg:#fff;--card:#fff;--panel:#f7f7f8;--text:#171717;--muted:#707070;--line:#e4e4e7;--hover:#f0f0f2;--accent:#171717;--accentText:#fff;--danger:#c92d2d}
:root[data-theme="dark"]{--bg:#181818;--card:#242424;--panel:#202020;--text:#f5f5f5;--muted:#c2c2c2;--line:#3b3b3b;--hover:#303030;--accent:#f5f5f5;--accentText:#171717;--danger:#ff7676}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(900px,calc(100% - 32px));margin:auto;padding:42px 0 70px}.back{color:var(--muted);text-decoration:none}.eyebrow{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:750}.hero{margin:42px 0 26px}.hero h1{font-size:42px;line-height:1.05;letter-spacing:-.05em;margin:6px 0}.hero p{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--card);margin-top:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.muted{color:var(--muted);font-size:12px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:6px}.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:0}.button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accentText,#fff);font-weight:700;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.outline,.danger{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);color:var(--text);font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.danger{border-color:#efc0c0;color:var(--danger)}.notice{background:var(--panel);border-radius:11px;padding:12px;margin-top:14px;color:var(--muted);font-size:12px}.key{font:12px ui-monospace,Consolas,monospace;overflow:auto;white-space:nowrap;margin:8px 0}.list{display:grid;gap:10px;margin-top:15px}.key-card{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--card)}
@media(max-width:600px){.hero h1{font-size:34px}.row{align-items:flex-start;flex-direction:column}.button,.outline,.danger{width:100%}}
</style>
</head>
<body>
<main>
<a class="back" href="/">← Mirae AI</a>
<section class="hero"><div class="eyebrow">DEVELOPER</div><h1>API 키</h1><p>계정에 연결된 OpenAI 호환 API 키를 안전하게 관리합니다.</p></section>
<section class="card">
<div class="row"><div><b>새 API 키 발급</b><div class="muted">전체 키는 생성 직후 한 번만 표시됩니다.</div></div></div>
<div class="field"><label>키 이름</label><input class="input" id="name" maxlength="80" placeholder="예: Unity prototype"></div>
<button class="button" id="create">API 키 발급</button>
<div class="notice" id="notice">로그인 후 발급할 수 있습니다. 발급된 전체 키는 서버 DB에 저장되지 않습니다.</div>
</section>
<section class="card"><div class="row"><div><b>내 API 키</b><div class="muted">폐기한 키는 다시 사용할 수 없습니다.</div></div></div><div class="list" id="list"><div class="muted">불러오는 중…</div></div></section>
</main>
<script>
const $=s=>document.querySelector(s),API="/api";
async function req(path,opt={}){const r=await fetch(API+path,{credentials:"include",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"요청에 실패했습니다.");return d}
async function boot(){try{await req("/auth/me");load()}catch{$("#list").innerHTML="<div class='muted'>API 키를 관리하려면 먼저 Mirae AI에 로그인하세요. <a href='/'>로그인</a></div>"}}
async function load(){try{const rows=await req("/api-keys"),box=$("#list");box.innerHTML="";if(!rows.length){box.innerHTML="<div class='muted'>발급된 API 키가 없습니다.</div>";return}rows.forEach(k=>{const el=document.createElement("div");el.className="key-card";el.innerHTML="<div class='row'><div><b>"+escapeHtml(k.name)+"</b><div class='key'>"+escapeHtml(k.key_prefix)+"…</div><div class='muted'>"+escapeHtml(k.state)+"</div></div><button class='danger'>폐기</button></div>";el.querySelector("button").onclick=async()=>{if(!confirm("이 API 키를 폐기할까요?"))return;try{await req("/api-keys/"+k.id,{method:"DELETE"});load()}catch(e){alert(e.message)}};box.appendChild(el)})}catch(e){$("#list").innerHTML="<div class='muted'>"+escapeHtml(e.message)+"</div>"}}
$("#create").onclick=async()=>{try{const d=await req("/api-keys",{method:"POST",body:JSON.stringify({name:$("#name").value})});$("#name").value="";$("#notice").innerHTML="<b>지금 복사하세요.</b><div class='key'>"+escapeHtml(d.key)+"</div>전체 값은 다시 조회할 수 없습니다.";load()}catch(e){$("#notice").textContent=e.message}}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
boot();
</script>
</body></html>
