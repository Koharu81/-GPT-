<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirae AI</title>
<style>
:root{--bg:#fff;--panel:#f7f7f8;--text:#202123;--muted:#6b7280;--line:#e5e7eb;--soft:#f3f4f6;--accent:#111827;--sidebar:272px}html.dark{--bg:#212121;--panel:#171717;--text:#ececec;--muted:#a1a1aa;--line:#343434;--soft:#2a2a2a;--accent:#fff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea,input,select{font:inherit}button{cursor:pointer}
.theme-dark .suggestion,.theme-dark .new-chat,.theme-dark .icon{background:#2a2a2a;color:#eee}.theme-dark .sidebar{background:#171717}.theme-dark .topbar{background:rgba(33,33,33,.9)}.theme-dark .composer-wrap{background:linear-gradient(transparent,#212121 30%)}.theme-dark .composer,.theme-dark .panel{background:#2a2a2a;color:#eee}.theme-dark .composer textarea,.theme-dark .panel input,.theme-dark .panel textarea,.theme-dark .panel select{color:#eee;background:#2a2a2a}.theme-dark .user .bubble{background:#343434}.app{height:100%;display:flex;overflow:hidden}.sidebar{width:var(--sidebar);flex:none;background:#f7f7f8;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px}.brand{display:flex;align-items:center;gap:10px;padding:10px 10px 16px;font-weight:750;font-size:16px}.brand-mark{width:28px;height:28px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center;font-size:13px}
.new-chat{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;text-align:left;font-weight:600}.new-chat:hover,.history-item:hover{background:#eee}.section-label{font-size:11px;color:#8a8a8a;margin:18px 9px 7px}.history{overflow:auto;flex:1}.history-item{width:100%;border:0;background:transparent;border-radius:9px;padding:9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#333;margin-bottom:2px}.history-item.active{background:#e9e9ea;font-weight:600}.side-bottom{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}.side-link{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;border-radius:9px;padding:10px;color:#444;text-align:left}.side-link:hover{background:#eee}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;background:rgba(255,255,255,.9);backdrop-filter:blur(15px)}.top-title{font-weight:650}.top-actions{display:flex;gap:7px}.icon{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff}.icon:hover{background:#f4f4f4}
.chat{flex:1;overflow:auto}.chat-inner{width:min(860px,calc(100% - 32px));margin:auto;padding:35px 0 150px}.hero{min-height:58vh;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:42px;letter-spacing:-.055em;margin:0 0 10px}.hero p{color:var(--muted);margin:0}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:25px}.suggestion{padding:13px 15px;text-align:left;border:1px solid var(--line);border-radius:13px;background:#fff}.suggestion:hover{background:#f7f7f7}
.message{display:flex;gap:12px;padding:17px 0}.avatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}.message.user{justify-content:flex-end}.message.user .avatar{order:2;background:#111;color:#fff}.message.assistant .avatar{background:#e9e9ea}.bubble{max-width:78%;white-space:pre-wrap;word-break:break-word}.user .bubble{background:#f0f0f0;border-radius:18px;padding:10px 14px}.assistant .bubble{padding-top:3px}.meta{font-size:10px;color:#999;margin-top:8px}.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.source{font-size:11px;color:#555;border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-decoration:none}.source:hover{background:#f5f5f5}
.composer-wrap{position:fixed;left:calc(var(--sidebar) + (100vw - var(--sidebar))/2 - 430px);right:0;bottom:0;padding:30px 16px 15px;background:linear-gradient(transparent,#fff 30%)}.composer{width:min(860px,calc(100% - 32px));margin:auto;border:1px solid #d7d7d7;border-radius:18px;background:#fff;box-shadow:0 7px 28px rgba(0,0,0,.08);display:flex;align-items:flex-end;padding:9px 9px 9px 15px}.composer textarea{border:0;outline:0;resize:none;min-height:26px;max-height:180px;flex:1;padding:7px 0;background:transparent}.send{width:39px;height:39px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700}.send:disabled{opacity:.35}.composer-status{text-align:center;color:#999;font-size:10px;margin-top:6px}
.panel{position:fixed;right:18px;top:68px;width:350px;max-width:calc(100% - 36px);border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 18px 55px rgba(0,0,0,.14);padding:18px;z-index:20}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel h2{margin:0;font-size:15px}.field{margin:15px 0}.field label{display:block;font-size:12px;color:#666;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;outline:none}.field textarea{min-height:85px;resize:vertical}.switch{display:flex!important;align-items:center;gap:8px}.switch input{width:auto}
@media(max-width:760px){:root{--sidebar:0px}.sidebar{display:none}.hero h1{font-size:34px}.suggestions{grid-template-columns:1fr}.composer-wrap{left:0}.chat-inner{width:min(100% - 24px,860px)}.bubble{max-width:88%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">M</div><span>Mirae AI</span></div>
  <button class="new-chat" id="newChat">＋ 새 대화</button>
  <div class="section-label">대화 기록</div>
  <div class="history" id="historyList"></div>
  <div class="side-bottom">
    <button class="side-link" id="apiDocs">⌘ API 문서</button><button class="side-link" id="apiKeys">⌕ API 키</button>
    <button class="side-link" id="settings">⚙ 설정</button>
  </div>
</aside>
<main class="main">
<header class="topbar"><div class="top-title" id="topTitle">새 대화</div><div class="top-actions"><button class="icon" id="loginBtn" title="로그인">↪</button><button class="icon" id="mobileNew" title="새 대화">＋</button></div></header>
<section class="chat" id="chat"><div class="chat-inner" id="messages"></div></section>
<div class="composer-wrap">
<form class="composer" id="form"><textarea id="input" rows="1" placeholder="Mirae에게 무엇이든 물어보세요"></textarea><button class="send" id="send" type="submit">↑</button></form>
<div class="composer-status">웹 검색은 기본으로 켜져 있습니다 · 답변은 현재 사용 가능한 모델과 검색 결과에 따라 달라질 수 있습니다.</div>
</div>
</main>
<div class="panel hidden" id="panel">
<div class="row"><h2>설정</h2><button class="icon" id="close">×</button></div>
<div class="field"><label>디스플레이</label><select id="theme"><option value="system">시스템 맞춤</option><option value="dark">다크</option><option value="light">화이트</option></select></div><div class="field"><label>인격</label><select id="personality"><option value="balanced">균형 잡힌</option><option value="friendly">친근한</option><option value="professional">전문적인</option><option value="concise">간결한</option><option value="creative">창의적인</option></select></div>
<div class="field"><label>개인 지침</label><textarea id="instructions" placeholder="Mirae가 대화할 때 지켜야 할 방식을 적어주세요."></textarea></div>
<div class="field"><label class="switch"><input type="checkbox" id="web" checked> 웹 검색 기본 사용</label></div>
<div class="field"><label>창의성 <span id="tempValue">0.70</span></label><input id="temp" type="range" min=".2" max="1.2" step=".05" value=".7"></div>
</div>
<div class="panel hidden" id="accountPanel"><div class="row"><h2>로그인</h2><button class="icon" id="accountClose">×</button></div><p style="color:var(--muted);font-size:12px">Mirae 계정으로 로그인하면 대화, API 키, 설정을 계정에 연결할 수 있습니다.</p><div class="field"><label>이메일</label><input id="loginEmail" type="email" placeholder="you@example.com"></div><div class="field"><label>비밀번호</label><input id="loginPassword" type="password" placeholder="비밀번호"></div><button class="new-chat" id="loginSubmit" style="background:#111;color:#fff;text-align:center">로그인</button><button class="side-link" id="signupBtn" style="justify-content:center;margin-top:6px">계정 만들기</button><p id="authStatus" style="color:#b45309;font-size:11px;margin-top:12px">계정 인증 서버 연결을 준비 중입니다.</p></div>
</div>
<script>
const $=s=>document.querySelector(s);
const messages=$("#messages"),input=$("#input"),send=$("#send"),historyList=$("#historyList"),topTitle=$("#topTitle");
const settings=JSON.parse(localStorage.getItem("mirae-settings")||"{}");
$("#theme").value=settings.theme||"system";$("#personality").value=settings.personality||"balanced";$("#instructions").value=settings.instructions||"";
$("#web").checked=settings.web!==false;$("#temp").value=settings.temperature||".7";$("#tempValue").textContent=Number($("#temp").value).toFixed(2);
let chats=JSON.parse(localStorage.getItem("mirae-chats")||"[]");let currentId=null;let history=[];
const saveSettings=()=>localStorage.setItem("mirae-settings",JSON.stringify({theme:$("#theme").value,personality:$("#personality").value,instructions:$("#instructions").value,web:$("#web").checked,temperature:Number($("#temp").value)})); function applyTheme(){const t=$("#theme").value;document.documentElement.classList.toggle("dark",t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches));document.body.classList.toggle("theme-dark",document.documentElement.classList.contains("dark"));} applyTheme();
function persistChats(){localStorage.setItem("mirae-chats",JSON.stringify(chats.slice(-80)));}
function renderHistory(){historyList.innerHTML="";[...chats].reverse().forEach(c=>{const b=document.createElement("button");b.className="history-item"+(c.id===currentId?" active":"");b.textContent=c.title||"새 대화";b.onclick=()=>loadChat(c.id);historyList.appendChild(b)})}
function renderEmpty(){messages.innerHTML='<section class="hero"><h1>무엇을 도와드릴까요?</h1><p>질문, 아이디어, 학습, 창작, 게임, 번역, 분석까지 자연스럽게 이어가세요.</p><div class="suggestions"><button class="suggestion" data-prompt="최신 정보를 찾아서 오늘 중요한 소식을 간단히 정리해줘">최신 정보<br><small>웹 검색으로 현재 소식을 확인</small></button><button class="suggestion" data-prompt="새로운 게임 아이디어를 하나 만들고 구체적으로 발전시켜줘">아이디어<br><small>게임이나 창작 아이디어 발전</small></button><button class="suggestion" data-prompt="어려운 개념 하나를 중학생도 이해할 수 있게 설명해줘">학습<br><small>복잡한 개념을 쉽게 이해</small></button><button class="suggestion" data-prompt="자연스러운 한국어 글을 하나 작성해줘">글쓰기<br><small>자연스러운 문장과 글 작성</small></button></div></section>';document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>ask(b.dataset.prompt));}
function addMessage(role,text,sources=[]){const el=document.createElement("article");el.className="message "+role;const av=document.createElement("div");av.className="avatar";av.textContent=role==="user"?"나":"M";const wrap=document.createElement("div");const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;wrap.appendChild(bubble);if(role==="assistant"){const meta=document.createElement("div");meta.className="meta";meta.textContent="Mirae AI";wrap.appendChild(meta);if(sources.length){const box=document.createElement("div");box.className="sources";sources.forEach(s=>{const a=document.createElement("a");a.className="source";a.href=s.url;a.target="_blank";a.rel="noopener";a.textContent=s.title;box.appendChild(a)});wrap.appendChild(box)}}el.append(av,wrap);messages.appendChild(el);requestAnimationFrame(()=>el.scrollIntoView({behavior:"smooth",block:"end"}));}
function saveCurrent(){if(!currentId||!history.length)return;const c=chats.find(x=>x.id===currentId);if(!c)return;c.messages=history;c.title=history.find(x=>x.role==="user")?.content?.slice(0,36)||"새 대화";c.updatedAt=Date.now();persistChats();renderHistory();topTitle.textContent=c.title;}
function loadChat(id){const c=chats.find(x=>x.id===id);if(!c)return;currentId=id;history=c.messages||[];messages.innerHTML="";history.forEach(m=>addMessage(m.role,m.content,m.sources||[]));topTitle.textContent=c.title||"새 대화";renderHistory();input.focus();}
function newChat(){saveCurrent();currentId=crypto.randomUUID();history=[];messages.innerHTML="";renderEmpty();topTitle.textContent="새 대화";renderHistory();input.focus();}
function ensureChat(){if(currentId)return;currentId=crypto.randomUUID();chats.push({id:currentId,title:"새 대화",messages:[],updatedAt:Date.now()});persistChats();renderHistory();}
function setBusy(v){send.disabled=v;send.textContent=v?"…":"↑";}
async function ask(text){const message=text.trim();if(!message)return;ensureChat();if(history.length===0)messages.innerHTML="";addMessage("user",message);history.push({role:"user",content:message});topTitle.textContent=message.slice(0,36);input.value="";input.style.height="auto";setBusy(true);
const thinking=document.createElement("article");thinking.className="message assistant";thinking.innerHTML='<div class="avatar">M</div><div><div class="bubble">검색하고 답변을 준비하는 중…</div></div>';messages.appendChild(thinking);
try{const s={personality:$("#personality").value,instructions:$("#instructions").value,web_search:$("#web").checked,temperature:Number($("#temp").value)};
const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history:history.slice(-12),...s})});
const data=await response.json();if(!response.ok)throw new Error(data.detail||"API 요청에 실패했습니다.");
thinking.remove();addMessage("assistant",data.reply,data.sources||[]);history.push({role:"assistant",content:data.reply,sources:data.sources||[]});saveCurrent();
}catch(error){thinking.remove();addMessage("assistant","오류가 발생했습니다. "+error.message);history.pop();}finally{setBusy(false);input.focus();}}
$("#form").addEventListener("submit",e=>{e.preventDefault();ask(input.value)});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(input.value)}});input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px"});
$("#newChat").onclick=newChat;$("#mobileNew").onclick=newChat;$("#theme").addEventListener("change",()=>{applyTheme();saveSettings()});matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if($("#theme").value==="system")applyTheme()});$("#loginBtn").onclick=()=>$("#accountPanel").classList.toggle("hidden");$("#accountClose").onclick=()=>$("#accountPanel").classList.add("hidden");$("#apiKeys").onclick=()=>{location.href="/api-keys"};$("#loginSubmit").onclick=()=>{$("#authStatus").textContent="로그인 서버가 아직 이 정적 배포에 연결되지 않았습니다. 먼저 계정 백엔드를 연결해야 합니다.";};$("#signupBtn").onclick=()=>{$("#authStatus").textContent="회원가입 서버가 아직 연결되지 않았습니다.";};$("#settings").onclick=()=>$("#panel").classList.toggle("hidden");$("#close").onclick=()=>$("#panel").classList.add("hidden");$("#apiDocs").onclick=()=>location.href="/api-docs";
["personality","instructions","web"].forEach(id=>$("#"+id).addEventListener("input",saveSettings));$("#temp").addEventListener("input",()=>{$("#tempValue").textContent=Number($("#temp").value).toFixed(2);saveSettings()});
if(chats.length)loadChat(chats[chats.length-1].id);else{currentId=crypto.randomUUID();renderEmpty();renderHistory()}input.focus();
</script>
</body>
</html>
