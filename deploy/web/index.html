<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirae AI</title><style>:root{--bg:#fff;--panel:#f7f7f8;--card:#fff;--text:#171717;--muted:#707070;--line:#e5e5e5;--hover:#f0f0f0;--accent:#171717;--accentText:#fff;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{display:flex;height:100vh;overflow:hidden}.sidebar{width:260px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px;padding:9px}.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accentText);display:grid;place-items:center}.new{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 12px;text-align:left;margin:10px 0 18px;cursor:pointer}.label{font-size:11px;color:var(--muted);padding:0 8px 7px}.history{overflow:auto;flex:1}.history button,.side button{display:block;width:100%;border:0;background:transparent;color:var(--text);padding:9px 10px;border-radius:9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history button:hover,.side button:hover{background:var(--hover)}.side{border-top:1px solid var(--line);padding-top:10px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top strong{font-size:15px}.top-actions{display:flex;gap:7px}.icon{width:35px;height:35px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer}.chat{flex:1;overflow:auto}.inner{width:min(860px,calc(100% - 34px));margin:auto;padding:30px 0 145px}.hero{min-height:58vh;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:44px;letter-spacing:-.06em;margin:0 0 7px}.hero p{color:var(--muted);margin:0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px;text-align:left;color:var(--text);cursor:pointer}.card:hover{background:var(--hover)}.card b{display:block;margin-bottom:3px}.card span{color:var(--muted);font-size:12px}.msg{display:flex;gap:12px;padding:18px 0}.avatar{width:30px;height:30px;border-radius:50%;background:var(--hover);display:grid;place-items:center;flex:none;font-size:11px;font-weight:700}.msg.user{justify-content:flex-end}.msg.user .avatar{order:2;background:var(--accent);color:var(--accentText)}.bubble{max-width:78%;white-space:pre-wrap;word-break:break-word}.user .bubble{background:var(--hover);padding:10px 14px;border-radius:17px}.meta{font-size:10px;color:var(--muted);margin-top:7px}.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.sources a{border:1px solid var(--line);padding:5px 8px;border-radius:8px;color:var(--text);text-decoration:none;font-size:11px}.composer-wrap{position:fixed;bottom:0;left:260px;right:0;padding:28px 16px 14px;background:linear-gradient(transparent,var(--bg) 32%)}.composer{width:min(860px,calc(100% - 34px));margin:auto;border:1px solid var(--line);background:var(--card);border-radius:19px;padding:9px;display:flex;box-shadow:0 8px 35px #0000000b}.composer textarea{flex:1;border:0;outline:0;background:transparent;color:var(--text);resize:none;max-height:160px;padding:8px}.send{border:0;background:var(--accent);color:var(--accentText);width:40px;height:40px;border-radius:12px;cursor:pointer}.status{text-align:center;color:var(--muted);font-size:10px;margin-top:6px}.overlay{position:fixed;inset:0;background:#0006;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20}.hidden{display:none!important}.modal{width:min(940px,calc(100% - 24px));max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 90px #0004}.auth{width:min(430px,calc(100% - 24px));padding:28px}.auth h2{margin:0 0 6px;font-size:28px}.muted{color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:0}.primary{width:100%;padding:11px;border:0;border-radius:10px;background:var(--accent);color:var(--accentText);cursor:pointer;font-weight:700}.switch{border:0;background:none;color:var(--blue);cursor:pointer;margin-top:12px}.auth-msg{min-height:22px;color:#c33;margin:9px 0;font-size:12px}.settings{display:flex;min-height:600px}.nav{width:220px;background:var(--panel);padding:18px;border-right:1px solid var(--line)}.nav h2{margin:4px 8px 18px}.nav button{width:100%;border:0;background:transparent;color:var(--text);padding:10px;text-align:left;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--hover)}.setting-body{padding:30px;flex:1}.setting-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:20px}.setting-row{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.setting-row small{display:block;color:var(--muted);margin-top:3px}.control{width:260px}.account-pill{font-size:12px;border:1px solid var(--line);border-radius:9px;padding:7px 10px}.logout{margin-top:18px;border:1px solid var(--line);background:var(--card);padding:9px 13px;border-radius:9px;cursor:pointer}@media(max-width:760px){.sidebar{display:none}.composer-wrap{left:0}.cards{grid-template-columns:1fr}.hero h1{font-size:34px}.setting-row{display:block}.control{width:100%;margin-top:9px}.settings{min-height:100%;display:block}.nav{width:100%;display:flex;overflow:auto}.nav h2{display:none}.nav button{width:auto;white-space:nowrap}.setting-body{padding:20px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="mark">M</div>Mirae AI</div><button class="new" id="newChat">＋ 새 대화</button><div class="label">최근 대화</div><div class="history" id="history"></div><div class="side"><button id="keys">API 키</button><button id="docs">API 문서</button><button id="settings">설정</button></div></aside><main class="main"><header class="top"><strong id="title">새 대화</strong><div class="top-actions"><button class="icon" id="account">계정</button><button class="icon" id="mobileNew">＋</button></div></header><section class="chat" id="chat"><div class="inner" id="messages"></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Mirae에게 무엇이든 물어보세요"></textarea><button class="send" id="send">↑</button></form><div class="status">웹 검색 기본 켜짐 · 로그인하면 대화가 계정에 저장됩니다.</div></div></main></div><div class="overlay hidden" id="authOverlay"><div class="modal auth"><h2 id="authTitle">Mirae에 로그인</h2><p class="muted" id="authDesc">계정으로 대화 기록과 설정을 동기화하세요.</p><div class="field hidden" id="nameField"><label>이름</label><input id="name" maxlength="40"></div><div class="field"><label>이메일</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>비밀번호</label><input id="password" type="password" minlength="8" autocomplete="current-password"></div><div class="auth-msg" id="authMsg"></div><button class="primary" id="authSubmit">로그인</button><button class="switch" id="authSwitch">처음이라면 회원가입</button></div></div><div class="overlay hidden" id="settingsOverlay"><div class="modal settings"><nav class="nav"><h2>설정</h2><button class="active" data-page="general">일반</button><button data-page="personal">개인화</button><button data-page="appearance">모양</button><button data-page="privacy">데이터</button><button data-page="accountPage">계정</button><button data-page="developer">개발자</button></nav><section class="setting-body"><div class="setting-head"><h2 id="settingTitle">일반</h2><button class="icon" id="closeSettings">×</button></div><div id="page-general"><div class="setting-row"><div><b>웹 검색</b><small>최신 정보가 필요한 질문에서 검색합니다.</small></div><div class="control"><select id="web"><option value="true">켜짐</option><option value="false">꺼짐</option></select></div></div><div class="setting-row"><div><b>답변 스타일</b><small>Mirae의 기본 응답 성격입니다.</small></div><div class="control"><select id="personality"><option value="balanced">균형 잡힌</option><option value="friendly">친근한</option><option value="professional">전문적인</option><option value="concise">간결한</option><option value="creative">창의적인</option></select></div></div></div><div class="hidden" id="page-personal"><div class="setting-row"><div><b>개인 지침</b><small>새 대화에서 항상 참고합니다.</small></div><div class="control"><textarea id="instructions" rows="6" placeholder="예: 항상 한국어로 답하고 핵심부터 설명해줘."></textarea></div></div></div><div class="hidden" id="page-appearance"><div class="setting-row"><div><b>테마</b><small>기본값은 화이트입니다.</small></div><div class="control"><select id="theme"><option value="light">화이트</option><option value="system">시스템</option><option value="dark">다크</option></select></div></div></div><div class="hidden" id="page-privacy"><div class="setting-row"><div><b>대화 기록</b><small>로그인 상태에서는 NeonDB에 계정별로 저장됩니다.</small></div><button class="logout" id="clearLocal">이 브라우저 기록 삭제</button></div></div><div class="hidden" id="page-accountPage"><div class="setting-row"><div><b>현재 계정</b><small id="userInfo">로그인하지 않음</small></div></div><button class="logout" id="logout">로그아웃</button></div><div class="hidden" id="page-developer"><div class="setting-row"><div><b>API</b><small>OpenAI 호환 API와 계정별 키를 관리합니다.</small></div><button class="logout" id="openKeys">API 키 관리</button></div><div class="setting-row"><div><b>API 문서</b><small>사용법과 엔드포인트를 확인합니다.</small></div><button class="logout" id="openDocs">문서 열기</button></div></div></section></div></div><script>const $=s=>document.querySelector(s),API="/api",messages=$("#messages"),historyEl=$("#history");let chats=[],current=[],currentId=null,user=null,settings={theme:"light",personality:"balanced",instructions:"",web_search:true,temperature:.7};async function req(path,opt={}){let r=await fetch(API+path,{credentials:"include",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"요청에 실패했습니다.");return d}async function boot(){try{let m=await req("/auth/me");user=m.user;$("#account").textContent=user.name;try{settings=await req("/settings")}catch{}try{let h=await req("/history");restoreServer(h)}catch{}}catch{}applyTheme();renderHistory();newChat(false)}function restoreServer(rows){let grouped=[],cur=null;for(const x of rows){if(x.role==="user"){cur={id:crypto.randomUUID(),title:x.content.slice(0,35),messages:[]};grouped.push(cur)}if(cur)cur.messages.push({role:x.role,content:x.content,sources:x.sources||[]})}chats=grouped;localStorage.setItem("mirae-local",JSON.stringify(chats))}function applyTheme(){let t=settings.theme||"light";document.documentElement.dataset.theme=t;if(t==="dark"||t==="system"&&matchMedia("(prefers-color-scheme:dark)").matches){document.documentElement.style.setProperty("--bg","#181818");document.documentElement.style.setProperty("--panel","#202020");document.documentElement.style.setProperty("--card","#242424");document.documentElement.style.setProperty("--text","#f5f5f5");document.documentElement.style.setProperty("--muted","#c2c2c2");document.documentElement.style.setProperty("--line","#3b3b3b");document.documentElement.style.setProperty("--hover","#303030");document.documentElement.style.setProperty("--accent","#f5f5f5");document.documentElement.style.setProperty("--accentText","#171717")}else document.documentElement.removeAttribute("style")}function renderEmpty(){messages.innerHTML='<section class="hero"><h1>무엇을 도와드릴까요?</h1><p>질문, 학습, 창작, 분석, 번역까지 하나의 대화에서 이어가세요.</p><div class="cards"><button class="card" data-q="최신 중요한 소식을 찾아서 정리해줘"><b>최신 정보</b><span>웹 검색으로 현재 정보를 확인</span></button><button class="card" data-q="새로운 게임 아이디어를 하나 구체적으로 만들어줘"><b>아이디어</b><span>게임과 프로젝트 아이디어 발전</span></button><button class="card" data-q="어려운 개념을 중학생도 이해하게 설명해줘"><b>학습</b><span>복잡한 내용을 쉽게 이해</span></button><button class="card" data-q="자연스러운 한국어 글을 작성해줘"><b>글쓰기</b><span>문장과 콘텐츠를 함께 작성</span></button></div></section>';document.querySelectorAll("[data-q]").forEach(x=>x.onclick=()=>ask(x.dataset.q))}function add(role,text,sources=[]){let e=document.createElement("article");e.className="msg "+role;e.innerHTML='<div class="avatar">'+(role==="user"?"나":"M")+'</div><div class="wrap"><div class="bubble"></div></div>';e.querySelector(".bubble").textContent=text;if(role==="assistant"&&sources.length){let box=document.createElement("div");box.className="sources";sources.forEach(s=>{let a=document.createElement("a");a.href=s.url;a.target="_blank";a.rel="noopener";a.textContent=s.title;box.appendChild(a)});e.querySelector(".wrap").appendChild(box)}messages.appendChild(e);e.scrollIntoView({behavior:"smooth",block:"end"})}function renderHistory(){historyEl.innerHTML="";[...chats].reverse().forEach(c=>{let b=document.createElement("button");b.textContent=c.title||"새 대화";b.onclick=()=>load(c.id);historyEl.appendChild(b)})}function load(id){let c=chats.find(x=>x.id===id);if(!c)return;currentId=id;current=c.messages||[];messages.innerHTML="";current.forEach(m=>add(m.role,m.content,m.sources));$("#title").textContent=c.title||"새 대화";renderHistory()}function newChat(save=true){if(save&&current.length)saveChat();current=[];currentId=crypto.randomUUID();messages.innerHTML="";renderEmpty();$("#title").textContent="새 대화"}function saveChat(){let c=chats.find(x=>x.id===currentId);if(!c){c={id:currentId,title:current.find(x=>x.role==="user")?.content.slice(0,35)||"새 대화",messages:[]};chats.push(c)}c.messages=current;c.title=current.find(x=>x.role==="user")?.content.slice(0,35)||"새 대화";localStorage.setItem("mirae-local",JSON.stringify(chats));renderHistory()}async function ask(text){text=text.trim();if(!text)return;if(!current.length)messages.innerHTML="";add("user",text);current.push({role:"user",content:text});$("#title").textContent=text.slice(0,35);$("#input").value="";$("#send").disabled=true;try{let d=await req("/chat",{method:"POST",body:JSON.stringify({message:text,history:current.slice(-12),personality:settings.personality,instructions:settings.instructions,web_search:settings.web_search,temperature:settings.temperature})});add("assistant",d.reply,d.sources||[]);current.push({role:"assistant",content:d.reply,sources:d.sources||[]});saveChat()}catch(e){add("assistant","오류가 발생했습니다. "+e.message);current.pop()}finally{$("#send").disabled=false;$("#input").focus()}}$("#form").onsubmit=e=>{e.preventDefault();ask($("#input").value)};$("#input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(e.target.value)}};$("#input").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,160)+"px"};$("#newChat").onclick=()=>newChat();$("#mobileNew").onclick=()=>newChat();$("#docs").onclick=$("#openDocs").onclick=()=>location.href="/api-docs";$("#keys").onclick=$("#openKeys").onclick=()=>location.href="/api-keys";function openAuth(){ $("#authOverlay").classList.remove("hidden");$("#authMsg").textContent="" }function closeAuth(){$("#authOverlay").classList.add("hidden")}let signupMode=false;function renderAuth(){$("#authTitle").textContent=signupMode?"Mirae 계정 만들기":"Mirae에 로그인";$("#authDesc").textContent=signupMode?"회원가입 후 채팅 기록과 설정을 계정에 저장합니다.":"계정으로 대화 기록과 설정을 동기화하세요." ;$("#nameField").classList.toggle("hidden",!signupMode);$("#authSubmit").textContent=signupMode?"회원가입":"로그인";$("#authSwitch").textContent=signupMode?"이미 계정이 있다면 로그인":"처음이라면 회원가입"}$("#authSwitch").onclick=()=>{signupMode=!signupMode;renderAuth()};$("#account").onclick=()=>user?($("#settingsOverlay").classList.remove("hidden"),$("#userInfo").textContent=user.name+" · "+user.email):openAuth();$("#authSubmit").onclick=async()=>{try{let body=signupMode?{name:$("#name").value,email:$("#email").value,password:$("#password").value}:{email:$("#email").value,password:$("#password").value};let d=await req(signupMode?"/auth/signup":"/auth/login",{method:"POST",body:JSON.stringify(body)});user=d.user;closeAuth();$("#account").textContent=user.name;$("#userInfo").textContent=user.name+" · "+user.email;let h=await req("/history");restoreServer(h);newChat(false)}catch(e){$("#authMsg").textContent=e.message}};$("#settings").onclick=()=>$("#settingsOverlay").classList.remove("hidden");$("#closeSettings").onclick=()=>$("#settingsOverlay").classList.add("hidden");document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".setting-body>div[id^=page]").forEach(x=>x.classList.add("hidden"));$("#page-"+b.dataset.page).classList.remove("hidden");$("#settingTitle").textContent=b.textContent});async function saveSettings(){settings={theme:$("#theme").value,personality:$("#personality").value,instructions:$("#instructions").value,web_search:$("#web").value==="true",temperature:.7};applyTheme();if(user)try{await req("/settings",{method:"PUT",body:JSON.stringify(settings)})}catch(e){console.error(e)}}["theme","personality","instructions","web"].forEach(id=>$("#"+id).onchange=saveSettings);$("#logout").onclick=async()=>{try{await req("/auth/logout",{method:"POST"})}catch{}user=null;$("#account").textContent="계정";$("#settingsOverlay").classList.add("hidden");newChat(false)};$("#clearLocal").onclick=()=>{localStorage.removeItem("mirae-local");chats=[];newChat(false)};renderAuth();boot();</script></body></html>
